[package]
name = "vime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "A virtual keyboard with IME for SteamVR"
repository = "https://github.com/Harukoto-Project/vime"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1.13"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
egui_glow = { version = "0.37", default-features = false }
global-hotkey = "0.8"
libloading = "0.8"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Input_Ime"] }
windows-sys = { version = "0.61", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
