[package]
name = "vime"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "A virtual keyboard with IME for SteamVR"
repository = "https://github.com/Harukoto-Project/vime"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1.13"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "links"] }
egui_glow = { version = "0.37", default-features = false }
global-hotkey = "0.8"
libloading = "0.8"
raw-window-handle = "0.6"
semver = "1"
windows = { version = "0.62", features = ["Win32_Globalization", "Win32_System_Com", "Win32_UI_Input_Ime"] }
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
